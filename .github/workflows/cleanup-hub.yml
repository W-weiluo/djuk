name: Cleanup old Hub repo

on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old duanjuku repository
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          JWT=$(curl -s -H "Content-Type: application/json" \
            -d "{\"username\":\"$DH_USER\",\"password\":\"$DH_TOKEN\"}" \
            https://hub.docker.com/v2/users/login | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          echo "JWT length: ${#JWT}"
          echo "== 尝试删除旧仓库 $DH_USER/duanjuku =="
          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X DELETE \
            -H "Authorization: JWT $JWT" \
            "https://hub.docker.com/v2/repositories/$DH_USER/duanjuku/")
          echo "HTTP $CODE"
          cat /tmp/resp.json; echo
