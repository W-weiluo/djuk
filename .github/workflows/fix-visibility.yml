name: Fix Hub visibility

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Flip repository visibility to public
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          JWT=$(curl -s -H "Content-Type: application/json" \
            -d "{\"username\":\"$DH_USER\",\"password\":\"$DH_TOKEN\"}" \
            https://hub.docker.com/v2/users/login | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          echo "JWT length: ${#JWT}"
          echo "== 当前仓库信息 =="
          curl -s -H "Authorization: JWT $JWT" \
            "https://hub.docker.com/v2/repositories/$DH_USER/duanjuku/" | head -c 500; echo
          echo "== PATCH repositories =="
          curl -s -X PATCH -H "Authorization: JWT $JWT" -H "Content-Type: application/json" \
            -d '{"registry_status":"public"}' \
            "https://hub.docker.com/v2/repositories/$DH_USER/duanjuku/" | head -c 300; echo
          echo "== PATCH namespaces =="
          curl -s -X PATCH -H "Authorization: JWT $JWT" -H "Content-Type: application/json" \
            -d '{"registry_status":"public"}' \
            "https://hub.docker.com/v2/namespaces/$DH_USER/repositories/duanjuku/" | head -c 300; echo
          echo "== 结果验证(应显示 is_public / visibility) =="
          curl -s -H "Authorization: JWT $JWT" \
            "https://hub.docker.com/v2/repositories/$DH_USER/duanjuku/" | head -c 500; echo
